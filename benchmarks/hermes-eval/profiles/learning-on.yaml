# Separate HERMES_HOME required. No shared sessions, memory, skills or run records.
# Runtime launcher must add only this run's MCP server and model route.
toolsets: [phantomveil-hermes, memory, skills]
agent:
  disabled_toolsets: [web, browser, terminal, file, code_execution, vision, video, image_gen, video_gen, x_search, tts, stt, todo, context_engine, session_search, connections, clarify, delegation, cronjob, homeassistant, spotify, yuanbao, computer_use, a2a, kanban]
tools:
  tool_search:
    enabled: "off"
memory:
  memory_enabled: true
  user_profile_enabled: true
  write_approval: true
skills:
  write_approval: true
auxiliary:
  background_review:
    enabled: true
